name: Check engine links

# Weekly, on every push to manifest.json, and by hand from the Actions tab.
# If it fails, GitHub emails you: a link has moved or the file behind it changed.
on:
  schedule:
    - cron: '17 21 * * 0'   # Sundays 21:17 UTC = Mondays 7:17 am Brisbane
  push:
    paths:
      - 'manifest.json'
      - 'manifest.json.sig'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signature, links and checksums
        run: node tools/check-links.mjs
